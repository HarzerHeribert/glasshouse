name: CI

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The compiler is declared once, in Cargo.toml's [workspace.metadata.ci],
      # and read here the same way the msrv job reads rust-version — so this
      # job and scripts/ci-local.sh cannot drift onto different compilers.
      - name: Read the declared toolchain
        id: toolchain
        shell: bash
        run: |
          version="$(grep -m1 '^toolchain' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "toolchain declared in Cargo.toml: $version"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --workspace --all-targets
        env:
          RUSTFLAGS: -D warnings

      - name: Test
        run: cargo test --locked --workspace -- --nocapture
        env:
          RUSTFLAGS: -D warnings

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The compiler is declared once, in Cargo.toml's [workspace.metadata.ci],
      # and read here the same way the msrv job reads rust-version — so this
      # job and scripts/ci-local.sh cannot drift onto different compilers.
      - name: Read the declared toolchain
        id: toolchain
        shell: bash
        run: |
          version="$(grep -m1 '^toolchain' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "toolchain declared in Cargo.toml: $version"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # Enforced from 2026-08-26. This gate existed in the SDLC for months and
      # had never once passed — 22 broken intra-doc links, tracked as a
      # "baseline 23" number instead of being fixed. A gate that lives only in
      # a document rots; put it where it runs.
      - name: Rustdoc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Check README progress block
        run: python3 scripts/progress.py --check

  msrv:
    name: msrv (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Read the floor out of the manifest rather than repeating it here, so
      # this job and `rust-version` cannot drift apart. Declared once, in
      # Cargo.toml, and enforced from there.
      - name: Read the declared MSRV
        id: msrv
        shell: bash
        run: |
          version="$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MSRV declared in Cargo.toml: $version"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # Compilation only, and deliberately without `-D warnings`: an older
      # compiler lints differently, and making that fatal would fail this job
      # for warnings the `test` and `lint` jobs already gate on at stable.
      # What this job answers is one question — does the floor still build.
      # `--all-targets` because a dependency can be MSRV-clean for the library
      # and not for the test targets.
      - name: Check
        run: cargo check --locked --workspace --all-targets
