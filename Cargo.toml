[workspace]
resolver = "3"
members = ["crates/glasshouse"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/HarzerHeribert/glasshouse"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ctrlc = { version = "3", features = ["termination"] }
directories = "6"
hex = "0.4"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
portable-pty = "0.9"
which = "8"
libc = "0.2"
tempfile = "3"

[profile.release]
strip = true
