[workspace]
resolver = "3"
members = ["crates/glasshouse"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/HarzerHeribert/glasshouse"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ctrlc = { version = "3", features = ["termination"] }
directories = "6"
getrandom = "0.4"
hex = "0.4"
# The OS credential store, pinned to the 3.6 minor line. 4.x declares
# `rust-version = "1.88.0"`; this workspace pins 1.85 and CI gates on
# `rustup run 1.85.0 cargo check --locked`, so the 3→4 jump is an MSRV cliff
# and `--locked` is the only thing between a routine `cargo update` and a red
# gate. 3.6.3 declares `rust-version = "1.75"`.
#
# `default-features = false` and no platform feature *here* on purpose: with
# no backend feature enabled, keyring 3.x resolves `keyring::default` to its
# **mock** store, which accepts and returns credentials in-process and
# persists nothing. That is precisely the silent degradation Phase 9E line 2
# forbids, so the backend feature is enabled per target instead — see
# `crates/glasshouse/Cargo.toml`, where only macOS turns on `apple-native`.
keyring = { version = "3.6", default-features = false }
ratatui = "0.30"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
# Blocking HTTP with rustls, and a response body that is a `Read` — the two
# properties that let the gateway stream a response through without an async
# runtime. `default-features = false` drops `gzip`: transparent decompression
# would rewrite a body the gateway promises to pass through untouched.
ureq = { version = "3", default-features = false, features = ["rustls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
portable-pty = "0.9"
which = "8"
libc = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
tempfile = "3"

[profile.release]
strip = true
